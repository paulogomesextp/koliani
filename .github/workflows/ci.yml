name: CI

# Corre os testes headless e produz os builds (Web + APK Android + Windows)
# como artifacts em cada push. Assim ha sempre um APK para o Paulo instalar no
# telemovel e um .exe para o playtester, sem depender do PC do Paulo estar
# ligado (mesma filosofia do deploy do jogo do jardim).
#
# Os artifacts do Actions so' se descarregam com sessao iniciada, por isso o
# que interessa sai por tres portas PUBLICAS:
#   - Release "win-latest"     -> o .zip do Windows (link fixo, playtester)
#   - Release "android-latest" -> o APK de debug (link fixo, telemovel)
#   - GitHub Pages             -> o build Web (a saida para iOS: a Apple nao
#                                 tem caminho nativo gratis)
#
# NOTA: a primeira execucao real pode precisar de afinacao (versao exata da
# imagem godot-ci, nome do preset, sdk Android). Ajustar aqui conforme os
# logs do Actions. Ver README.md > "CI / builds".

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# `contents: write` -> os jobs "windows"/"android" criarem e actualizarem os
# Releases de tag rolante. `pages` + `id-token` -> publicar o build Web.
permissions:
  contents: write
  pages: write
  id-token: write

env:
  GODOT_CI_IMAGE: barichello/godot-ci:4.7.2

jobs:
  testes:
    name: Testes headless
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Importar recursos
        run: godot --headless --import || true
      - name: Correr suite de testes
        run: godot --headless --script res://tests/run_tests.gd
      # As regras de bicho (divide_em / so_tiro / so_mexe_sem_olhar) vivem no
      # DemonioBase, e a suite nao o consegue instanciar: em `--script` os
      # autoloads que ele usa nao existem como IDENTIFICADOR e o teste
      # passaria em silencio sem medir nada. Este corre a' parte.
      - name: Regras de bicho
        run: godot --headless --script res://tools/verifica_regras_bicho.gd
      - name: Actores novos (Iman, ChaoQuente, Ceifa, PlataformaOlhar, Ariete)
        run: godot --headless --script res://tools/verifica_actores_novos.gd
      - name: As 100 jornadas constroem-se
        run: godot --headless --script res://tools/verifica_jornada.gd

  web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: testes
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Instalar templates de export
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
      - name: Importar recursos
        run: godot --headless --import || true
      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: koliani-web
          path: build/web

  android:
    name: Build Android (APK debug)
    runs-on: ubuntu-latest
    needs: testes
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Instalar templates de export
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
      - name: Gerar keystore de debug
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 \
            -deststoretype pkcs12
      # O QUE FALTAVA, dito pelo proprio Godot no run 330:
      #   "Cannot export project with preset "Android" due to configuration
      #    errors: A valid Java SDK path is required in Editor Settings."
      # A imagem traz o OpenJDK 17, mas com o `JAVA_HOME` VAZIO -- e o Godot 4
      # nao procura o `javac` no PATH: le `export/android/java_sdk_path` das
      # EDITOR SETTINGS. O mesmo vale para o SDK do Android
      # (`export/android/android_sdk_path`), de onde sai o `apksigner` que
      # assina o pacote (`package/signed=true` no preset), mesmo com
      # `gradle_build/use_gradle_build=false`. As editor settings so' existem
      # depois de o editor ter corrido uma vez -- e' o que este passo faz.
      - name: Preparar o SDK do Android e o JDK nas editor settings
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}"
          fi
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          # a raiz do JDK e' o avo' do `javac` real (bin/javac -> ../..)
          if [ -z "$JAVA_HOME" ]; then
            jc=$(command -v javac || command -v java)
            JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$jc")")")
            export JAVA_HOME
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          godot --headless --editor --quit >/dev/null 2>&1 || true
          cfg=$(find ~/.config/godot -name 'editor_settings-*.tres' 2>/dev/null | head -1)
          if [ -n "$cfg" ]; then
            grep -v 'export/android/android_sdk_path' "$cfg" \
              | grep -v 'export/android/java_sdk_path' > "$cfg.novo"
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\"" >> "$cfg.novo"
            echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> "$cfg.novo"
            mv "$cfg.novo" "$cfg"
            echo "$cfg" > cfg_path.txt
          else
            echo "(nenhum)" > cfg_path.txt
          fi
      # Os logs dos Actions deste repo pedem sessao iniciada para se lerem,
      # mas as ANOTACOES sao publicas -- e' por elas que o diagnostico e o erro
      # chegam ca' fora. Sem isto o unico sinal do lado de fora era
      # "Process completed with exit code 1".
      - name: Diagnostico do ambiente Android
        run: |
          {
            echo "ANDROID_HOME=${ANDROID_HOME:-(vazio)}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-(vazio)}"
            echo "JAVA_HOME=${JAVA_HOME:-(vazio)}"
            java -version 2>&1 | head -2
            echo "-- build-tools --"
            ls "${ANDROID_HOME:-/usr/lib/android-sdk}/build-tools" 2>&1 | head -5
            echo "-- apksigner --"
            find / -maxdepth 7 -name 'apksigner*' 2>/dev/null | head -3
            echo "-- editor settings --"
            cfg=$(cat cfg_path.txt 2>/dev/null)
            echo "ficheiro: ${cfg:-(nenhum)}"
            [ -f "$cfg" ] && grep -E 'android_sdk_path|java_sdk_path' "$cfg"
            echo "-- templates de android --"
            ls ~/.local/share/godot/export_templates/*/ 2>&1 | grep -i android
          } > diag.txt 2>&1
          cat diag.txt
          # UMA anotacao com tudo la' dentro: o GitHub so' cria as PRIMEIRAS
          # DEZ anotacoes de cada nivel por passo, e uma linha por anotacao
          # fazia o essencial cair fora. `%0A` e' o escape de newline dos
          # comandos de workflow.
          msg=$(sed 's/%/%25/g' diag.txt | awk '{printf "%s%%0A", $0}')
          echo "::warning title=Ambiente Android::$msg"
      - name: Importar recursos
        run: godot --headless --import || true
      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          set +e
          godot --headless --export-debug "Android" build/android/koliani.apk > apk.log 2>&1
          rc=$?
          set -e
          cat apk.log
          if [ "$rc" -ne 0 ]; then
            # O "Unable to load fontconfig" repete-se e nao e' o problema
            # (headless nao tem fontes); fora com ele para nao gastar espaco.
            # E tudo vai numa ANOTACAO SO': o GitHub so' cria as primeiras dez
            # anotacoes de cada nivel por passo, e uma-linha-por-anotacao
            # fazia o essencial cair fora.
            msg=$(grep -av 'Unable to load fontconfig' apk.log | tail -n 50 |
                  sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Export do APK (exit $rc)::$msg"
          fi
          exit "$rc"
      - uses: actions/upload-artifact@v4
        with:
          name: koliani-android
          path: build/android/koliani.apk
      # Tag rolante, a par do "win-latest": o Paulo instala sempre do mesmo
      # link, sem ter de andar a cacar artifacts (que pedem sessao iniciada).
      - name: Publicar no Release "android-latest"
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Koliani -- APK Android mais recente
          make_latest: false
          files: build/android/koliani.apk
          body: |
            Build automatica do commit `${{ github.sha }}` (run #${{ github.run_number }}).

            **Como instalar:** descarrega `koliani.apk` no telemovel e abre-o.
            O Android pede para permitir "instalar apps desconhecidas" ao
            browser -> permitir -> instalar. E' um APK de DEBUG assinado com
            uma chave de debug: serve para jogar, nao para a Play Store.

  windows:
    name: Build Windows (release)
    runs-on: ubuntu-latest
    needs: testes
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Instalar templates de export
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
      - name: Importar recursos
        run: godot --headless --import || true
      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/Koliani.exe
      - name: Empacotar zip
        run: |
          cd build/windows
          zip -r ../../Koliani-windows.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: koliani-windows
          path: Koliani-windows.zip
      - name: Publicar no Release "win-latest"
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-latest
          name: Koliani -- build Windows mais recente
          make_latest: true
          files: Koliani-windows.zip
          body: |
            Build automatica do commit `${{ github.sha }}` (run #${{ github.run_number }}).

            **Como jogar:** descarrega `Koliani-windows.zip`, extrai a pasta toda
            e corre `Koliani.exe`. O Windows SmartScreen vai avisar ("editor
            desconhecido") -> *Mais informacoes* -> *Executar mesmo assim*.

            O progresso fica guardado em
            `%APPDATA%\Godot\app_userdata\Koliani\progresso.json` -- apagar esse
            ficheiro recomeca o jogo do zero.

  # O build Web ja' era exportado mas ficava so' como artifact, que pede sessao
  # iniciada para se descarregar. Passa a ser PUBLICADO no GitHub Pages -- e' o
  # unico caminho gratis para o iPhone (a Apple nao tem alternativa nativa: o
  # Apple ID gratis expira ao fim de 7 dias e exige um Mac, e a TestFlight
  # exige os 99 EUR/ano).
  pages:
    name: Publicar o Web no GitHub Pages
    runs-on: ubuntu-latest
    needs: web
    # PENDENTE DO PAULO: o `GITHUB_TOKEN` NAO consegue criar o site de Pages
    # ("Resource not accessible by integration" -- e' uma limitacao conhecida
    # do `configure-pages` com o token por omissao). E' preciso ir uma vez a
    #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
    # e a partir dai este job passa a funcionar sozinho. Ate' la' fica
    # `continue-on-error` para nao pintar o CI de vermelho a cada push.
    continue-on-error: true
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # So' um deploy de Pages de cada vez -- e' este JOB que se serializa, nao
    # o workflow todo (a nivel de workflow, um push novo cancelava tambem os
    # testes e os builds do run anterior).
    #
    # `cancel-in-progress: false` de proposito: com `true`, um push novo
    # cancelava o job de Pages do run anterior e esse run inteiro passava a
    # aparecer como **Cancelled** -- mesmo com os tres builds a passar. O
    # estado do run passava a mentir sobre o que se construiu.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: koliani-web
          path: build/web
      # `enablement: true` liga o Pages sozinho na primeira vez, em vez de
      # obrigar a ir mexer nas definicoes do repo a mao.
      - id: cfg
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Avisar se o Pages ainda nao esta ligado
        if: steps.cfg.outcome != 'success'
        run: |
          echo "::warning::O GitHub Pages ainda nao esta ligado neste repo. Settings -> Pages -> Source: GitHub Actions. Depois disso este job publica sozinho."
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4
