name: CI

# Corre os testes headless e produz os builds (Web + APK Android) como
# artifacts em cada push. Assim ha sempre um APK para o Paulo instalar no
# telemovel sem depender do PC dele estar ligado (mesma filosofia do deploy
# do jogo do jardim).
#
# NOTA: a primeira execucao real pode precisar de afinacao (versao exata da
# imagem godot-ci, nome do preset, sdk Android). Ajustar aqui conforme os
# logs do Actions. Ver README.md > "CI / builds".

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  GODOT_CI_IMAGE: barichello/godot-ci:4.3

jobs:
  testes:
    name: Testes headless
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Importar recursos
        run: godot --headless --import || true
      - name: Correr suite de testes
        run: godot --headless --script res://tests/run_tests.gd

  web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: testes
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Instalar templates de export
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
      - name: Importar recursos
        run: godot --headless --import || true
      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: koliani-web
          path: build/web

  android:
    name: Build Android (APK debug)
    runs-on: ubuntu-latest
    needs: testes
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Instalar templates de export
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
      - name: Gerar keystore de debug
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 \
            -deststoretype pkcs12
      - name: Importar recursos
        run: godot --headless --import || true
      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/koliani.apk
      - uses: actions/upload-artifact@v4
        with:
          name: koliani-android
          path: build/android/koliani.apk
