html/head_include="<meta name='apple-mobile-web-app-capable' content='yes'> <meta name='mobile-web-app-capable' content='yes'> <meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'> <meta name='apple-mobile-web-app-title' content='Koliani'> <meta name='theme-color' content='#0d0814'> <meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'> <style> /* 2. TIRAR OS TIQUES DE BROWSER QUE ESTRAGAM UM JOGO --------------- */ html,body{width:100%;height:100%;overflow:hidden;background:#0d0814; overscroll-behavior:none;-webkit-user-select:none;user-select:none; -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent} #canvas{width:100%;height:100%;touch-action:none} /* 3. HORIZONTAL SEMPRE --------------------------------------------- O iOS ignora o `orientation` do manifest e não tem `screen.orientation.lock` -- o Android tem, e tenta-se lá em baixo. Onde não dá, o jogo NÃO se joga de pé: esta cortina tapa-o e diz porquê. É preferível a rodar o canvas por CSS, que roda o desenho mas não as coordenadas do toque (ficava a jogar às cegas). */ #rodar{position:fixed;inset:0;z-index:9;display:none; background:#0d0814;color:#ece6f7; font:600 4.6vmin/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; text-align:center;align-items:center;justify-content:center; flex-direction:column;gap:5vmin;padding:8vmin} #rodar svg{width:34vmin;height:auto} #rodar .gira{animation:gira 2.4s ease-in-out infinite} @keyframes gira{0%,42%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}} @media (prefers-reduced-motion:reduce){#rodar .gira{animation:none}} @media (orientation:portrait){#rodar{display:flex}} </style> <div id='rodar' aria-hidden='true'><svg viewBox='0 0 120 120' fill='none' xmlns='http://www.w3.org/2000/svg'><path d='M22 44a42 42 0 0 1 76 0' stroke='#a45cff' stroke-width='4' stroke-linecap='round' stroke-dasharray='7 9'/><path d='M98 30v15h-15' stroke='#a45cff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/><g class='gira' style='transform-origin:60px 74px'><rect x='42' y='50' width='36' height='58' rx='7' stroke='#ff5fd4' stroke-width='4'/><rect x='48' y='58' width='24' height='40' rx='2' fill='#ff5fd4' fill-opacity='.18'/></g></svg><span>Turn your phone sideways</span></div> <script> (function(){ /* 4. SOM NO TELEMOVEL --------------------------------------------- Terceira tentativa, e a razao de as duas primeiras nao terem chegado esta escrita aqui para nao se repetir: a) o INTERRUPTOR DE SILENCIO. Por omissao o WebKit trata o Web Audio como som de interface e cala-o com o interruptor lateral do telefone. `audioSession.type = playback` diz-lhe que isto e conteudo. (Existe no Safari 16.4+; o Chrome do iPhone tambem e WebKit, portanto vale la tambem.) b) o CONTEXTO NASCE SUSPENSO. Um `AudioContext` criado sem um toque do utilizador fica suspenso. O Godot cria o dele no arranque, antes de haver toque nenhum -- por isso embrulha-se o construtor para saber quais sao. c) E O QUE FALTAVA: no WebKit o `resume()` sozinho NAO chega. O contexto passa a `running` e continua mudo. O que o desbloqueia e TOCAR alguma coisa de dentro do gesto -- um buffer de uma amostra, silencioso, chega. Sem isso o estado mente. d) e nao se tenta UMA vez: tenta-se em cada toque enquanto nao estiver a tocar, e outra vez ao voltar ao jogo (mudar de app suspende o contexto e ele nao volta sozinho). Se mesmo assim ficar mudo, aparece um botao a dizer isso -- ver mais abaixo. Um jogo mudo sem explicacao nenhuma parece avariado; com o botao, ou se resolve com um toque ou fica-se a saber que o problema e outro. */ try{ if (navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){} var AC = window.AudioContext || window.webkitAudioContext; var vivos = []; if (AC){ var Espia = new Proxy(AC, {construct: function(alvo, args){ var c = new alvo(args[0]); vivos.push(c); return c; }}); window.AudioContext = Espia; window.webkitAudioContext = Espia; } var soar = function(c){ /* o desbloqueio a serio: uma amostra silenciosa tocada DE DENTRO do gesto. E isto, e nao o `resume()`, que faz o WebKit abrir o som. */ try{ var b = c.createBuffer(1, 1, 22050); var f = c.createBufferSource(); f.buffer = b; f.connect(c.destination); if (f.start) f.start(0); else if (f.noteOn) f.noteOn(0); }catch(e){} }; var acordar = function(){ for (var i = 0; i < vivos.length; i++){ var c = vivos[i]; try{ if (c.state !== 'running' && c.resume) c.resume(); }catch(e){} soar(c); } pintar(); }; /* `touchend` e nao `touchstart`: no iOS e o FIM do toque que conta como gesto do utilizador. E em captura, para chegar antes do canvas. */ ['touchend','pointerup','mouseup','keydown'].forEach(function(ev){ window.addEventListener(ev, acordar, {capture:true}); }); document.addEventListener('visibilitychange', function(){ if (!document.hidden) acordar(); }); /* O BOTAO DE ULTIMO RECURSO. So aparece se ja houver um contexto de audio e nenhum estiver a tocar -- ou seja, exactamente quando o jogo esta mudo. Ser um elemento do DOM (e nao o canvas) importa: o toque nele e o gesto mais limpo que ha para o WebKit aceitar. */ var pilula = null; var mudo = function(){ if (!vivos.length) return false; for (var i = 0; i < vivos.length; i++){ if (vivos[i].state === 'running') return false; } return true; }; var pintar = function(){ if (!pilula) return; pilula.style.display = mudo() ? 'flex' : 'none'; }; var montar = function(){ if (pilula || !document.body) return; pilula = document.createElement('button'); pilula.type = 'button'; pilula.textContent = 'Sound is off - tap here'; pilula.setAttribute('style', 'position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));' + 'transform:translateX(-50%);z-index:12;display:none;align-items:center;' + 'gap:.5rem;padding:.55rem 1rem;border-radius:999px;border:1px solid #ff5fd4;' + 'background:rgba(20,13,30,.92);color:#ece6f7;font:600 14px/1 -apple-system,' + 'system-ui,sans-serif;cursor:pointer;-webkit-appearance:none'); pilula.addEventListener('click', function(ev){ ev.stopPropagation(); acordar(); }); document.body.appendChild(pilula); setInterval(pintar, 700); }; if (document.body) montar(); else document.addEventListener('DOMContentLoaded', montar); /* 5. TRANCAR NA HORIZONTAL onde o browser deixa (Android). No iOS isto não existe e fica a cortina de cima. */ var trancar = function(){ try{ if (screen.orientation && screen.orientation.lock){ var p = screen.orientation.lock('landscape'); if (p && p.catch) p.catch(function(){}); } }catch(e){} }; trancar(); ['touchend','pointerup'].forEach(function(ev){ window.addEventListener(ev, trancar, {once:true, capture:true}); }); })(); </script>"
