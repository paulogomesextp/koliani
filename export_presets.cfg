html/head_include="<meta name='apple-mobile-web-app-capable' content='yes'> <meta name='mobile-web-app-capable' content='yes'> <meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'> <meta name='apple-mobile-web-app-title' content='Koliani'> <meta name='theme-color' content='#0d0814'> <meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'> <style> /* 2. TIRAR OS TIQUES DE BROWSER QUE ESTRAGAM UM JOGO --------------- */ html,body{width:100%;height:100%;overflow:hidden;background:#0d0814; overscroll-behavior:none;-webkit-user-select:none;user-select:none; -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent} #canvas{width:100%;height:100%;touch-action:none} #koliani-intro-layer::backdrop{background:transparent} /* 3. HORIZONTAL SEMPRE --------------------------------------------- O iOS ignora o `orientation` do manifest e não tem `screen.orientation.lock` -- o Android tem, e tenta-se lá em baixo. Onde não dá, o jogo NÃO se joga de pé: esta cortina tapa-o e diz porquê. É preferível a rodar o canvas por CSS, que roda o desenho mas não as coordenadas do toque (ficava a jogar às cegas). */ #rodar{position:fixed;inset:0;z-index:21;display:none; background:#0d0814;color:#ece6f7; font:600 4.6vmin/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; text-align:center;align-items:center;justify-content:center; flex-direction:column;gap:5vmin;padding:8vmin} #rodar svg{width:34vmin;height:auto} #rodar .gira{animation:gira 2.4s ease-in-out infinite} @keyframes gira{0%,42%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}} @media (prefers-reduced-motion:reduce){#rodar .gira{animation:none}} @media (orientation:portrait){#rodar.fallback{display:flex}} </style> <div id='rodar' aria-hidden='true'><svg viewBox='0 0 120 120' fill='none' xmlns='http://www.w3.org/2000/svg'><path d='M22 44a42 42 0 0 1 76 0' stroke='#a45cff' stroke-width='4' stroke-linecap='round' stroke-dasharray='7 9'/><path d='M98 30v15h-15' stroke='#a45cff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/><g class='gira' style='transform-origin:60px 74px'><rect x='42' y='50' width='36' height='58' rx='7' stroke='#ff5fd4' stroke-width='4'/><rect x='48' y='58' width='24' height='40' rx='2' fill='#ff5fd4' fill-opacity='.18'/></g></svg><span>Turn your phone sideways</span></div> <script> (function(){ /* 4. SOM NO TELEMOVEL --------------------------------------------- Terceira tentativa, e a razao de as duas primeiras nao terem chegado esta escrita aqui para nao se repetir: a) o INTERRUPTOR DE SILENCIO. Por omissao o WebKit trata o Web Audio como som de interface e cala-o com o interruptor lateral do telefone. `audioSession.type = playback` diz-lhe que isto e conteudo. (Existe no Safari 16.4+; o Chrome do iPhone tambem e WebKit, portanto vale la tambem.) b) o CONTEXTO NASCE SUSPENSO. Um `AudioContext` criado sem um toque do utilizador fica suspenso. O Godot cria o dele no arranque, antes de haver toque nenhum -- por isso embrulha-se o construtor para saber quais sao. c) A retoma tem de comecar DENTRO do gesto. `resume()` devolve uma Promise; verificar o estado logo a seguir da um falso negativo. Alem da retoma, agenda-se um pulso praticamente inaudivel dentro do mesmo gesto para cobrir as versoes de WebKit que o exigem. d) NO IPHONE, Web Audio e HTML Audio podem usar canais diferentes. Um audio HTML silencioso em loop, arrancado pelo toque, mantem o canal multimédia aberto mesmo com o interruptor lateral activo. e) e nao se tenta UMA vez: tenta-se em cada toque enquanto nao estiver a tocar, e outra vez ao voltar ao jogo (mudar de app suspende o contexto e ele nao volta sozinho). Se mesmo assim ficar mudo, aparece um botao a dizer isso -- ver mais abaixo. Um jogo mudo sem explicacao nenhuma parece avariado; com o botao, ou se resolve com um toque ou fica-se a saber que o problema e outro. */ try{ if (navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){} var AC = window.AudioContext || window.webkitAudioContext; var vivos = []; var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); var diagnostico = location.search.indexOf('audio-debug=1') >= 0; var canalIOS = null; var canalIOSAtivo = !ios; var erroCanalIOS = ''; var avisarGodot = function(){ try{ if (window.kolianiGodotAudioReady) window.kolianiGodotAudioReady(); }catch(e){} }; if (AC){ var Espia = new Proxy(AC, {construct: function(alvo, args){ var c = new alvo(args[0]); vivos.push(c); return c; }}); window.AudioContext = Espia; window.webkitAudioContext = Espia; } var wavSilencioso = function(amostragem){ /* WAVE mono de sete amostras, inspirado no mecanismo MIT `unmute-ios-audio`; pequeno, local e sem pedido de rede. */ var dados = new ArrayBuffer(10); var vista = new DataView(dados); vista.setUint32(0, amostragem, true); vista.setUint32(4, amostragem, true); vista.setUint16(8, 1, true); var bytes = new Uint8Array(dados); var texto = ''; for (var i = 0; i < bytes.length; i++) texto += String.fromCharCode(bytes[i]); var meio = window.btoa(texto).slice(0, 13); return 'data:audio/wav;base64,UklGRisAAABXQVZFZm10IBAAAAABAAEA' + meio + 'AgAZGF0YQcAAACAgICAgICAAAA='; }; var abrirCanalIOS = function(){ /* Durante a intro, o vídeo é o único HTML media com som. */ if (window.kolianiIntroAtiva) return; if (!ios || canalIOSAtivo) return; try{ if (!canalIOS){ var taxa = vivos.length && vivos[0].sampleRate ? vivos[0].sampleRate : 44100; canalIOS = document.createElement('audio'); canalIOS.setAttribute('playsinline', ''); canalIOS.setAttribute('x-webkit-airplay', 'deny'); canalIOS.preload = 'auto'; canalIOS.loop = true; canalIOS.src = wavSilencioso(taxa); canalIOS.load(); } var tocando = canalIOS.play(); if (tocando && tocando.then){ tocando.then(function(){ canalIOSAtivo = true; erroCanalIOS = ''; setTimeout(avisarGodot, 80); pintar(); }, function(e){ canalIOSAtivo = false; erroCanalIOS = e && e.name ? e.name : 'play rejeitado'; pintar(); }); } }catch(e){ canalIOSAtivo = false; erroCanalIOS = e && e.name ? e.name : 'erro'; } }; var soar = function(c){ /* Um pulso real, mas praticamente inaudivel. Um buffer integralmente a zero pode ser optimizado pelo browser e nao contar como reproducao. */ try{ var o = c.createOscillator(); var g = c.createGain(); g.gain.value = 0.00001; o.connect(g); g.connect(c.destination); o.start(0); o.stop(c.currentTime + 0.03); }catch(e){} }; var acordar = function(){ try{ if (navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){} abrirCanalIOS(); for (var i = 0; i < vivos.length; i++){ var c = vivos[i]; /* Ambas as operacoes comecam sincronicamente dentro do gesto. */ soar(c); try{ if (c.state !== 'running' && c.resume){ var retomado = c.resume(); if (retomado && retomado.then){ retomado.then(function(){ setTimeout(avisarGodot, 80); pintar(); }, function(){ pintar(); }); } } }catch(e){} } pintar(); }; /* A intro reutiliza este desbloqueio dentro do primeiro gesto DOM. */ window.kolianiAudioAcordar = acordar; /* Browsers e versoes de iOS divergem no evento reconhecido como activacao. Em captura, a tentativa chega antes de o canvas consumir o evento. */ ['touchstart','touchend','pointerdown','pointerup','mousedown','mouseup','click','keydown'].forEach(function(ev){ window.addEventListener(ev, acordar, {capture:true}); }); document.addEventListener('visibilitychange', function(){ if (!document.hidden) acordar(); }); /* DIAGNOSTICO (Execution 9F). `kolianiAudioDiag()` na consola diz o estado de cada contexto; com `?audio-debug=1` mede tambem o pico que chega ao altifalante -- o silencio total do Web era um bus do Godot sem saida para o destino, com o contexto `running`, e so o pico o mostrava. O ramo de medida so existe em modo diagnostico. */ if (diagnostico && window.AudioNode){ var ligar = AudioNode.prototype.connect; AudioNode.prototype.connect = function(alvo){ var r = ligar.apply(this, arguments); try{ if (window.AudioDestinationNode && alvo instanceof AudioDestinationNode){ var c = this.context; if (!c.kolianiMedidor){ c.kolianiMedidor = c.createAnalyser(); c.kolianiMedidor.fftSize = 2048; } ligar.call(this, c.kolianiMedidor); } }catch(e){} return r; }; } window.kolianiAudioDiag = function(){ var r = []; for (var i = 0; i < vivos.length; i++){ var c = vivos[i], pico = null; if (c.kolianiMedidor){ var d = new Float32Array(c.kolianiMedidor.fftSize); c.kolianiMedidor.getFloatTimeDomainData(d); pico = 0; for (var k = 0; k < d.length; k++) pico = Math.max(pico, Math.abs(d[k])); } r.push({estado: c.state, tempo: c.currentTime, pico: pico}); } return {contextos: r, canalIOS: canalIOSAtivo, erroCanalIOS: erroCanalIOS}; }; /* O BOTAO DE ULTIMO RECURSO. So aparece se ja houver um contexto de audio e nenhum estiver a tocar -- ou seja, exactamente quando o jogo esta mudo. Ser um elemento do DOM (e nao o canvas) importa: o toque nele e o gesto mais limpo que ha para o WebKit aceitar. */ var pilula = null; var estados = function(){ if (!vivos.length) return 'sem contexto'; var lista = []; for (var i = 0; i < vivos.length; i++) lista.push(vivos[i].state || 'desconhecido'); return lista.join(','); }; var testarSom = function(){ if (!diagnostico) return; for (var i = 0; i < vivos.length; i++){ var c = vivos[i]; if (c.state !== 'running') continue; try{ var o = c.createOscillator(); var g = c.createGain(); o.frequency.value = 660; g.gain.value = 0.08; o.connect(g); g.connect(c.destination); o.start(0); o.stop(c.currentTime + 0.18); }catch(e){} } }; var mudo = function(){ if (!vivos.length) return false; if (!canalIOSAtivo) return true; for (var i = 0; i < vivos.length; i++){ if (vivos[i].state === 'running') return false; } return true; }; var pintar = function(){ if (!pilula) return; if (diagnostico){ pilula.textContent = 'TESTE SOM — tocar para apitar | Web: ' + estados() + ' | canal iPhone: ' + (canalIOSAtivo ? 'activo' : 'bloqueado') + (erroCanalIOS ? ' (' + erroCanalIOS + ')' : ''); pilula.style.display = 'flex'; }else{ pilula.textContent = 'Sound is off - tap here'; pilula.style.display = mudo() ? 'flex' : 'none'; } }; var montar = function(){ if (!diagnostico || pilula || !document.body) return; pilula = document.createElement('button'); pilula.type = 'button'; pilula.textContent = 'Sound is off - tap here'; pilula.setAttribute('style', 'position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));' + 'transform:translateX(-50%);z-index:12;display:none;align-items:center;' + 'gap:.5rem;padding:.55rem 1rem;border-radius:999px;border:1px solid #ff5fd4;' + 'background:rgba(20,13,30,.92);color:#ece6f7;font:600 14px/1 -apple-system,' + 'system-ui,sans-serif;cursor:pointer;-webkit-appearance:none'); pilula.addEventListener('touchstart', acordar, {capture:true}); pilula.addEventListener('pointerdown', acordar, {capture:true}); pilula.addEventListener('click', function(){ acordar(); testarSom(); }, {capture:true}); document.body.appendChild(pilula); setInterval(pintar, 700); }; if (document.body) montar(); else document.addEventListener('DOMContentLoaded', montar); /* 5. Tentar no arranque e repetir no gesto; nunca esperar pelo lock para iniciar áudio/vídeo. Safari/iOS pode recusar ou não ter a API. */ var movel = /Android|iPad|iPhone|iPod/.test(navigator.userAgent) || ios; var fallback = false; var pintarOrientacao = function(){ var aviso = document.getElementById('rodar'); if (!aviso) return; aviso.classList.toggle('fallback', movel && fallback); aviso.setAttribute('aria-hidden', !(movel && fallback && innerHeight > innerWidth)); }; var trancar = function(){ if (!movel) return; try{ if (screen.orientation && screen.orientation.lock){ var p = screen.orientation.lock('landscape'); if (p && p.then) p.then(function(){ fallback = false; pintarOrientacao(); }, function(){ fallback = true; pintarOrientacao(); }); }else{ fallback = true; pintarOrientacao(); } }catch(e){ fallback = true; pintarOrientacao(); } }; window.kolianiLandscape = trancar; trancar(); ['touchend','click','keydown'].forEach(function(ev){ window.addEventListener(ev, trancar, {capture:true}); }); window.addEventListener('resize', pintarOrientacao); document.addEventListener('DOMContentLoaded', pintarOrientacao); })(); </script>"
